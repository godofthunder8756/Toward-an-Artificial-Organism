[project]
name = "bridge"
version = "0.1.0"
description = "Neural bridge reproducibility harness (CPU torch)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
