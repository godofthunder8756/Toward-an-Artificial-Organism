<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920" role="img" aria-labelledby="title desc"><title id="title">Figure 4. Probability assigned to the realized outcome before the run</title><desc id="desc">Sealed probabilities from Fable and Opus for the outcome that was later realized for each endpoint.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#102A43}.title{font-size:42px;font-weight:700}.sub{font-size:24px;fill:#52667A}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#52667A}.axis{font-size:18px;fill:#52667A}.direct{font-size:20px;font-weight:700}</style><text x="80" y="75" class="title" text-anchor="start">Sealed predictions preserved disagreements and misses</text><text x="80" y="120" class="sub" text-anchor="start">Points show probability assigned before the primary raw file existed to the outcome later realized.</text><line x1="450" y1="190" x2="450" y2="760" stroke="#D9E2EC" stroke-width="2"/><text x="450" y="170" class="axis" text-anchor="middle">0.00</text><line x1="715" y1="190" x2="715" y2="760" stroke="#D9E2EC" stroke-width="2"/><text x="715" y="170" class="axis" text-anchor="middle">0.25</text><line x1="980" y1="190" x2="980" y2="760" stroke="#D9E2EC" stroke-width="2"/><text x="980" y="170" class="axis" text-anchor="middle">0.50</text><line x1="1245" y1="190" x2="1245" y2="760" stroke="#D9E2EC" stroke-width="2"/><text x="1245" y="170" class="axis" text-anchor="middle">0.75</text><line x1="1510" y1="190" x2="1510" y2="760" stroke="#D9E2EC" stroke-width="2"/><text x="1510" y="170" class="axis" text-anchor="middle">1.00</text><text x="80" y="263" class="label" text-anchor="start">E1 — OUT OF TABLE</text><line x1="450" y1="255" x2="450" y2="255" stroke="#2B6CB0" stroke-width="5"/><circle cx="450" cy="255" r="12" fill="#2B6CB0"/><text x="468" y="262" class="body" text-anchor="start">Fable 0.00</text><line x1="450" y1="300" x2="450" y2="300" stroke="#E36B2C" stroke-width="5"/><rect x="439" y="289" width="22" height="22" fill="#E36B2C"/><text x="468" y="308" class="body" text-anchor="start">Opus 0.00</text><text x="80" y="403" class="label" text-anchor="start">E2 — Row 8</text><line x1="450" y1="395" x2="556" y2="395" stroke="#2B6CB0" stroke-width="5"/><circle cx="556" cy="395" r="12" fill="#2B6CB0"/><text x="574" y="402" class="body" text-anchor="start">Fable 0.10</text><line x1="450" y1="440" x2="1170.8000000000002" y2="440" stroke="#E36B2C" stroke-width="5"/><rect x="1159.8000000000002" y="429" width="22" height="22" fill="#E36B2C"/><text x="1188.8000000000002" y="448" class="body" text-anchor="start">Opus 0.68</text><text x="80" y="543" class="label" text-anchor="start">E3 — Row 3</text><line x1="450" y1="535" x2="874" y2="535" stroke="#2B6CB0" stroke-width="5"/><circle cx="874" cy="535" r="12" fill="#2B6CB0"/><text x="892" y="542" class="body" text-anchor="start">Fable 0.40</text><line x1="450" y1="580" x2="863.4000000000001" y2="580" stroke="#E36B2C" stroke-width="5"/><rect x="852.4000000000001" y="569" width="22" height="22" fill="#E36B2C"/><text x="881.4000000000001" y="588" class="body" text-anchor="start">Opus 0.39</text><text x="80" y="683" class="label" text-anchor="start">E4 — Row 3.5</text><line x1="450" y1="675" x2="450" y2="675" stroke="#2B6CB0" stroke-width="5"/><circle cx="450" cy="675" r="12" fill="#2B6CB0"/><text x="468" y="682" class="body" text-anchor="start">Fable 0.00</text><line x1="450" y1="720" x2="513.6" y2="720" stroke="#E36B2C" stroke-width="5"/><rect x="502.6" y="709" width="22" height="22" fill="#E36B2C"/><text x="531.6" y="728" class="body" text-anchor="start">Opus 0.06</text><text x="80" y="855" class="small" text-anchor="start">Four endpoints are insufficient to rank predictor quality; this is a process record, not a forecasting benchmark.</text></svg>