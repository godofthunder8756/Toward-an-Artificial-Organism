<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc"><title id="title">Figure 3. Detection ratio did not determine endpoint usability</title><desc id="desc">Detection ratios and final preregistered outcomes for four endpoints.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#102A43}.title{font-size:42px;font-weight:700}.sub{font-size:24px;fill:#52667A}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#52667A}.axis{font-size:18px;fill:#52667A}.direct{font-size:20px;font-weight:700}</style><text x="80" y="75" class="title" text-anchor="start">A large detection ratio was not enough</text><text x="80" y="120" class="sub" text-anchor="start">Final outcomes also depended on operating range, null construction, and decision-table coverage.</text><line x1="300" y1="190" x2="300" y2="755" stroke="#D9E2EC" stroke-width="2"/><text x="300" y="163" class="axis" text-anchor="middle">0</text><line x1="425" y1="190" x2="425" y2="755" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="10 8"/><text x="425" y="163" class="axis" text-anchor="middle">1</text><line x1="675" y1="190" x2="675" y2="755" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="10 8"/><text x="675" y="163" class="axis" text-anchor="middle">3</text><line x1="925" y1="190" x2="925" y2="755" stroke="#D9E2EC" stroke-width="2"/><text x="925" y="163" class="axis" text-anchor="middle">5</text><line x1="1175" y1="190" x2="1175" y2="755" stroke="#D9E2EC" stroke-width="2"/><text x="1175" y="163" class="axis" text-anchor="middle">7</text><line x1="1550" y1="190" x2="1550" y2="755" stroke="#D9E2EC" stroke-width="2"/><text x="1550" y="163" class="axis" text-anchor="middle">10</text><text x="925" y="925" class="axis" text-anchor="middle">Detection ratio, DR = |SEP| / NULL_scale</text><text x="425" y="200" class="small" text-anchor="middle">DR = 1</text><text x="675" y="200" class="small" text-anchor="middle">DR = 3</text><text x="85" y="278" class="label" text-anchor="start">E1</text><circle cx="1187.4499999999998" cy="270" r="15" fill="#2B6CB0"/><line x1="300" y1="270" x2="1187.4499999999998" y2="270" stroke="#2B6CB0" stroke-width="7"/><text x="1209.4499999999998" y="277" class="direct" text-anchor="start">7.10</text><text x="300" y="320" class="direct" text-anchor="start">Out-of-table STOP</text><text x="660" y="320" class="small" text-anchor="start">Decision rule did not cover the observation</text><text x="85" y="418" class="label" text-anchor="start">E2</text><circle cx="380.3625" cy="410" r="15" fill="#6B5AA6"/><line x1="300" y1="410" x2="380.3625" y2="410" stroke="#6B5AA6" stroke-width="7"/><text x="402.3625" y="417" class="direct" text-anchor="start">0.64</text><text x="300" y="460" class="direct" text-anchor="start">NOT_SEPARABLE</text><text x="660" y="460" class="small" text-anchor="start">Observed separation below null scale</text><text x="85" y="558" class="label" text-anchor="start">E3</text><circle cx="1459.3125" cy="550" r="15" fill="#007C83"/><line x1="300" y1="550" x2="1459.3125" y2="550" stroke="#007C83" stroke-width="7"/><text x="1481.3125" y="557" class="direct" text-anchor="start">9.27</text><text x="300" y="600" class="direct" text-anchor="start">FAILED_FLOOR_CEILING</text><text x="660" y="600" class="small" text-anchor="start">Strong separation, but d192 exceeded ceiling</text><text x="85" y="698" class="label" text-anchor="start">E4</text><text x="300" y="697" class="direct" text-anchor="start">undefined</text><text x="300" y="740" class="direct" text-anchor="start">UNDEFINED_ENDPOINT</text><text x="660" y="740" class="small" text-anchor="start">NULL_scale = 0 after order averaging</text></svg>