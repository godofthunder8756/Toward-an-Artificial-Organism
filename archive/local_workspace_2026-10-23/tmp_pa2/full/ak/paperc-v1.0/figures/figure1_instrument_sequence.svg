<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc"><title id="title">Figure 1. INSTRUMENT-0 study sequence</title><desc id="desc">Five-stage sequence from known-answer fixtures to the one-shot primary run.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#102A43}.title{font-size:42px;font-weight:700}.sub{font-size:24px;fill:#52667A}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#52667A}.axis{font-size:18px;fill:#52667A}.direct{font-size:20px;font-weight:700}</style><text x="90" y="90" class="title" text-anchor="start">INSTRUMENT-0: measurement before interpretation</text><text x="90" y="135" class="sub" text-anchor="start">Every gate was completed before the primary 261-row matrix was interpreted.</text><line x1="387" y1="465" x2="412" y2="465" stroke="#52667A" stroke-width="5"/><path d="M 402 453 L 422 465 L 402 477" fill="none" stroke="#52667A" stroke-width="5"/><rect x="95" y="360" width="292" height="210" rx="12" fill="#F5F8FA" stroke="#D9E2EC" stroke-width="3"/><circle cx="137" cy="402" r="25" fill="#102A43"/><text x="137" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" style="fill:#FFFFFF">1</text><text x="120" y="452" class="label" text-anchor="start">Known-answer fixtures</text><text x="120" y="492" class="body" text-anchor="start">39 / 39 PASS</text><text x="120" y="530" class="small" text-anchor="start">Synthetic data only</text><line x1="719" y1="465" x2="744" y2="465" stroke="#52667A" stroke-width="5"/><path d="M 734 453 L 754 465 L 734 477" fill="none" stroke="#52667A" stroke-width="5"/><rect x="427" y="360" width="292" height="210" rx="12" fill="#F5F8FA" stroke="#D9E2EC" stroke-width="3"/><circle cx="469" cy="402" r="25" fill="#102A43"/><text x="469" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" style="fill:#FFFFFF">2</text><text x="452" y="452" class="label" text-anchor="start">Proxy compatibility</text><text x="452" y="492" class="body" text-anchor="start">30 / 30 PASS</text><text x="452" y="530" class="small" text-anchor="start">No primary outcomes</text><line x1="1051" y1="465" x2="1076" y2="465" stroke="#52667A" stroke-width="5"/><path d="M 1066 453 L 1086 465 L 1066 477" fill="none" stroke="#52667A" stroke-width="5"/><rect x="759" y="360" width="292" height="210" rx="12" fill="#F5F8FA" stroke="#D9E2EC" stroke-width="3"/><circle cx="801" cy="402" r="25" fill="#102A43"/><text x="801" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" style="fill:#FFFFFF">3</text><text x="784" y="452" class="label" text-anchor="start">Instrument freeze</text><text x="784" y="492" class="body" text-anchor="start">43 artifacts</text><text x="784" y="530" class="small" text-anchor="start">Rules and bytes fixed</text><line x1="1383" y1="465" x2="1408" y2="465" stroke="#52667A" stroke-width="5"/><path d="M 1398 453 L 1418 465 L 1398 477" fill="none" stroke="#52667A" stroke-width="5"/><rect x="1091" y="360" width="292" height="210" rx="12" fill="#F5F8FA" stroke="#D9E2EC" stroke-width="3"/><circle cx="1133" cy="402" r="25" fill="#102A43"/><text x="1133" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" style="fill:#FFFFFF">4</text><text x="1116" y="452" class="label" text-anchor="start">Prediction seal</text><text x="1116" y="492" class="body" text-anchor="start">Fable + Opus</text><text x="1116" y="530" class="small" text-anchor="start">Primary raw absent</text><rect x="1423" y="360" width="292" height="210" rx="12" fill="#E8F5F3" stroke="#007C83" stroke-width="3"/><circle cx="1465" cy="402" r="25" fill="#007C83"/><text x="1465" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" style="fill:#FFFFFF">5</text><text x="1448" y="452" class="label" text-anchor="start">One-shot run</text><text x="1448" y="492" class="body" text-anchor="start">261 rows</text><text x="1448" y="530" class="small" text-anchor="start">9 points × 29 items</text><rect x="95" y="680" width="1610" height="115" rx="10" fill="#FFF7ED" stroke="#E36B2C" stroke-width="3"/><text x="125" y="725" class="label" text-anchor="start">Preservation rule</text><text x="390" y="725" class="body" text-anchor="start">If a defect appeared, stop and preserve it; do not repair the rule and reuse the same raw data.</text><text x="125" y="765" class="small" text-anchor="start">Primary inference unit: 16 equal-weight slugs. The 29 items are within-slug repetitions.</text></svg>