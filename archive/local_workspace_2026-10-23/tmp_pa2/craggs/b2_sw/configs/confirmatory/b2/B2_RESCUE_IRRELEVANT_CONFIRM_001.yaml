schema_version: 1.0.0
experiment:
  id: B2_RESCUE_IRRELEVANT_CONFIRM_001
  version: 1.0.0
  title: 'B2 confirmatory: equal-budget irrelevant rescue control'
  block: block1_b2
  mode: confirmatory
hypothesis:
  id: H1_4_SPECIFIC_RESCUE
  wording: Specific functional replacement rescues the predicted C2 deficit selectively;
    an equal-budget irrelevant rescue directed to C3 does not equivalently restore
    C2.
  claim_type: causal_contribution
environment:
  id: MAINTENANCE_NETWORK
  version: 1.0.0
  config: configs/environments/b2/maintenance_ablate_c1_irrelevant_rescue_v1.yaml
architectures:
- id: B2_RECIPROCAL
  version: 1.0.0
  config: configs/architectures/b2/reciprocal_v1.yaml
seeds:
  procedure: explicit
  values:
  - 254443587
  - 676812453
  - 494519943
  - 298946929
  - 141790924
  - 462690370
  - 672220313
  - 386034419
  - 473136542
  - 589534568
  - 366847981
  - 730433096
  - 172571491
  - 884327383
  - 813038724
  - 886430260
  - 193027560
  - 866196950
  - 502749228
  - 243163872
training:
  required: false
  budget:
    unit: steps
    value: 0
evaluation:
  suite_id: B2_CAUSAL_MAINTENANCE_CONFIRMATORY
  suite_version: 1.0.0
  held_out: true
  episodes_per_seed: 1
estimands:
  primary:
  - id: EST_H1_4_IRR
    name: specific_minus_irrelevant_c2_rescue
    definition: For each registered seed, terminal C2 under specific rescue minus
      terminal C2 under equal-budget irrelevant C3 rescue.
    unit: component state difference
    aggregation: paired mean and seed count across 20 registered seeds
  secondary:
  - id: EST_H1_4_IRR_C2
    name: irrelevant_rescue_c2_effect
    definition: Terminal C2 under irrelevant rescue minus terminal C2 under no-rescue
      ablation.
    unit: component state difference
    aggregation: paired mean across registered seeds
interventions:
- id: B2_ABLATE_C1_01
  registry: configs/registries/b2_interventions.yaml
rescues:
- id: B2_RESCUE_IRRELEVANT_C3_01
  registry: configs/registries/b2_rescues.yaml
  target_intervention_id: B2_ABLATE_C1_01
bypasses: []
invalid_run_conditions:
- id: INVALID_MANIFEST
  description: Manifest fails structural or semantic validation.
- id: INVALID_ENVIRONMENT
  description: Maintenance-network environment fails validation or produces non-finite
    component states.
- id: INVALID_PROVENANCE
  description: Required run provenance, seed identity, or raw-data integrity cannot
    be verified.
decision:
  permitted_outcomes:
  - RETAIN
  - RESTRICT
  - REDUCE
  - SUSPEND
  - REJECT
  rules:
  - id: DEC_H1_4_IRR
    hypothesis_id: H1_4_SPECIFIC_RESCUE
    retain_if: Specific rescue exceeds irrelevant rescue in terminal C2 by at least
      0.30 on average and by at least 0.30 in at least 16 of 20 seeds, while irrelevant
      rescue improves C2 by less than 0.10 on average relative to no-rescue ablation.
    restrict_if: Specific rescue is superior to irrelevant rescue but selectivity
      does not meet all preregistered thresholds.
    reject_if: Irrelevant rescue restores C2 equivalently to the specific rescue or
      the specific-versus-irrelevant difference is not reproducible.
provenance:
  require_manifest_hash: true
  require_config_hashes: true
  require_software_version: true
  require_source_commit: true
  require_runtime_metadata: true
outputs:
  require_raw_data: true
  require_processed_data: true
  require_figure: true
  require_table: true
  require_decision_record: true
