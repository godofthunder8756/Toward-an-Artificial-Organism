schema_version: 1.0.0
experiment:
  id: B2_MAINT_MEDIUM_CONFIRM_001
  version: 1.0.0
  title: 'B2 confirmatory: medium-disturbance maintenance comparison'
  block: block1_b2
  mode: confirmatory
hypothesis:
  id: H1_1_ACTIVE_ADVANTAGE
  wording: Active maintenance provides a selective advantage over passive stability
    as disturbance demands increase.
  claim_type: association
environment:
  id: MAINTENANCE_NETWORK
  version: 1.0.0
  config: configs/environments/b2/maintenance_medium_v1.yaml
architectures:
- id: B2_PASSIVE
  version: 1.0.0
  config: configs/architectures/b2/passive_v1.yaml
- id: B2_EXTERNAL
  version: 1.0.0
  config: configs/architectures/b2/external_v1.yaml
- id: B2_FEEDFORWARD
  version: 1.0.0
  config: configs/architectures/b2/feedforward_v1.yaml
- id: B2_RECIPROCAL
  version: 1.0.0
  config: configs/architectures/b2/reciprocal_v1.yaml
- id: B2_BRUTE_FORCE
  version: 1.0.0
  config: configs/architectures/b2/bruteforce_v1.yaml
seeds:
  procedure: explicit
  values:
  - 254443587
  - 676812453
  - 494519943
  - 298946929
  - 141790924
  - 462690370
  - 672220313
  - 386034419
  - 473136542
  - 589534568
  - 366847981
  - 730433096
  - 172571491
  - 884327383
  - 813038724
  - 886430260
  - 193027560
  - 866196950
  - 502749228
  - 243163872
training:
  required: false
  budget:
    unit: steps
    value: 0
evaluation:
  suite_id: B2_CAUSAL_MAINTENANCE_CONFIRMATORY
  suite_version: 1.0.0
  held_out: true
  episodes_per_seed: 1
estimands:
  primary:
  - id: EST_H1_1_MED_PATH
    name: medium_disturbance_path_viability
    definition: Proportion of registered seeds remaining viable at every step through
      horizon 400 in each architecture under the medium disturbance regime.
    unit: proportion
    aggregation: by architecture across 20 registered seeds
  secondary:
  - id: EST_H1_1_MED_FAIL
    name: medium_disturbance_time_to_first_failure
    definition: First simulation step at which any essential component falls below
      0.35, or right-censored at horizon 400 if no failure occurs.
    unit: steps
    aggregation: distribution by architecture
interventions: []
rescues: []
bypasses: []
invalid_run_conditions:
- id: INVALID_MANIFEST
  description: Manifest fails structural or semantic validation.
- id: INVALID_ENVIRONMENT
  description: Maintenance-network environment fails validation or produces non-finite
    component states.
- id: INVALID_PROVENANCE
  description: Required run provenance, seed identity, or raw-data integrity cannot
    be verified.
decision:
  permitted_outcomes:
  - RETAIN
  - RESTRICT
  - REDUCE
  - SUSPEND
  - REJECT
  rules:
  - id: DEC_H1_1_MED
    hypothesis_id: H1_1_ACTIVE_ADVANTAGE
    retain_if: At least three of the four active architectures are path viable in
      at least 16 of 20 seeds and passive path viability is lower than the mean active
      path viability.
    restrict_if: An active-maintenance advantage appears but is limited to fewer than
      three active architectures or the difference from passive persistence is small.
provenance:
  require_manifest_hash: true
  require_config_hashes: true
  require_software_version: true
  require_source_commit: true
  require_runtime_metadata: true
outputs:
  require_raw_data: true
  require_processed_data: true
  require_figure: true
  require_table: true
  require_decision_record: true
