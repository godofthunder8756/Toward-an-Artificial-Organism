schema_version: 1.0.0
experiment:
  id: B2_RESCUE_SPECIFIC_CONFIRM_001
  version: 1.0.0
  title: 'B2 confirmatory: specific C1-to-C2 functional rescue'
  block: block1_b2
  mode: confirmatory
hypothesis:
  id: H1_4_SPECIFIC_RESCUE
  wording: Specific functional replacement of the missing C1-to-C2 maintenance contribution
    selectively rescues the predicted downstream C2 deficit after C1 ablation.
  claim_type: causal_contribution
environment:
  id: MAINTENANCE_NETWORK
  version: 1.0.0
  config: configs/environments/b2/maintenance_ablate_c1_specific_rescue_v1.yaml
architectures:
- id: B2_RECIPROCAL
  version: 1.0.0
  config: configs/architectures/b2/reciprocal_v1.yaml
seeds:
  procedure: explicit
  values:
  - 254443587
  - 676812453
  - 494519943
  - 298946929
  - 141790924
  - 462690370
  - 672220313
  - 386034419
  - 473136542
  - 589534568
  - 366847981
  - 730433096
  - 172571491
  - 884327383
  - 813038724
  - 886430260
  - 193027560
  - 866196950
  - 502749228
  - 243163872
training:
  required: false
  budget:
    unit: steps
    value: 0
evaluation:
  suite_id: B2_CAUSAL_MAINTENANCE_CONFIRMATORY
  suite_version: 1.0.0
  held_out: true
  episodes_per_seed: 1
estimands:
  primary:
  - id: EST_H1_4_SPEC
    name: specific_rescue_c2_effect
    definition: For each registered seed, terminal C2 under specific rescue minus
      terminal C2 under C1 ablation without rescue.
    unit: component state difference
    aggregation: paired mean and seed count across 20 registered seeds
  secondary:
  - id: EST_H1_4_SPEC_TERM
    name: specific_rescue_terminal_c2
    definition: Terminal C2 state at horizon 600 under specific rescue.
    unit: component state
    aggregation: mean across registered seeds
interventions:
- id: B2_ABLATE_C1_01
  registry: configs/registries/b2_interventions.yaml
rescues:
- id: B2_RESCUE_SPECIFIC_C1_TO_C2_01
  registry: configs/registries/b2_rescues.yaml
  target_intervention_id: B2_ABLATE_C1_01
bypasses: []
invalid_run_conditions:
- id: INVALID_MANIFEST
  description: Manifest fails structural or semantic validation.
- id: INVALID_ENVIRONMENT
  description: Maintenance-network environment fails validation or produces non-finite
    component states.
- id: INVALID_PROVENANCE
  description: Required run provenance, seed identity, or raw-data integrity cannot
    be verified.
decision:
  permitted_outcomes:
  - RETAIN
  - RESTRICT
  - REDUCE
  - SUSPEND
  - REJECT
  rules:
  - id: DEC_H1_4_SPEC
    hypothesis_id: H1_4_SPECIFIC_RESCUE
    retain_if: Specific rescue increases terminal C2 by at least 0.30 on average relative
      to no-rescue ablation and produces an increase of at least 0.30 in at least
      16 of 20 registered seeds.
    restrict_if: Specific rescue improves C2 reproducibly but does not meet the preregistered
      magnitude or seed-consistency threshold.
    reject_if: Specific rescue fails to restore the predicted C2 function reproducibly.
provenance:
  require_manifest_hash: true
  require_config_hashes: true
  require_software_version: true
  require_source_commit: true
  require_runtime_metadata: true
outputs:
  require_raw_data: true
  require_processed_data: true
  require_figure: true
  require_table: true
  require_decision_record: true
