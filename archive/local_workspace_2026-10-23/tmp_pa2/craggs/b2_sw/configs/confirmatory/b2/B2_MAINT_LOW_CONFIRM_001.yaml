schema_version: 1.0.0
experiment:
  id: B2_MAINT_LOW_CONFIRM_001
  version: 1.0.0
  title: 'B2 confirmatory: low-disturbance maintenance comparison'
  block: block1_b2
  mode: confirmatory
hypothesis:
  id: H1_1_ACTIVE_ADVANTAGE
  wording: Active maintenance provides a selective advantage over passive stability
    as disturbance demands increase, while passive persistence remains viable under
    the preregistered low-disturbance sanity-check regime.
  claim_type: association
environment:
  id: MAINTENANCE_NETWORK
  version: 1.0.0
  config: configs/environments/b2/maintenance_low_v1.yaml
architectures:
- id: B2_PASSIVE
  version: 1.0.0
  config: configs/architectures/b2/passive_v1.yaml
- id: B2_EXTERNAL
  version: 1.0.0
  config: configs/architectures/b2/external_v1.yaml
- id: B2_FEEDFORWARD
  version: 1.0.0
  config: configs/architectures/b2/feedforward_v1.yaml
- id: B2_RECIPROCAL
  version: 1.0.0
  config: configs/architectures/b2/reciprocal_v1.yaml
- id: B2_BRUTE_FORCE
  version: 1.0.0
  config: configs/architectures/b2/bruteforce_v1.yaml
