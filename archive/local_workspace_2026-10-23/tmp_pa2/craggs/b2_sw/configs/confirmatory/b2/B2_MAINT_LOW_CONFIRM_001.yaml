  budget:
    unit: steps
    value: 0
evaluation:
  suite_id: B2_CAUSAL_MAINTENANCE_CONFIRMATORY
  suite_version: 1.0.0
  held_out: true
  episodes_per_seed: 1
estimands:
  primary:
  - id: EST_H1_1_LOW_PATH
    name: low_disturbance_path_viability
    definition: Proportion of registered seeds remaining viable at every step through
      horizon 400 in each architecture under the low disturbance regime.
    unit: proportion
    aggregation: by architecture across 20 registered seeds
  secondary:
  - id: EST_H1_1_LOW_TERM
    name: low_disturbance_terminal_min_q
    definition: Minimum component state at terminal step 400 under low disturbance.
    unit: component state
    aggregation: mean by architecture across registered seeds
interventions: []
rescues: []
bypasses: []
invalid_run_conditions:
- id: INVALID_MANIFEST
  description: Manifest fails structural or semantic validation.
- id: INVALID_ENVIRONMENT
  description: Maintenance-network environment fails validation or produces non-finite
    component states.
- id: INVALID_PROVENANCE
  description: Required run provenance, seed identity, or raw-data integrity cannot
    be verified.
decision:
  permitted_outcomes:
  - RETAIN
  - RESTRICT
  - REDUCE
  - SUSPEND
  - REJECT
  rules:
  - id: DEC_H1_1_LOW
    hypothesis_id: H1_1_ACTIVE_ADVANTAGE
    retain_if: Passive architecture is path viable in at least 16 of 20 seeds, confirming
      that the passive comparator is not trivially fragile under low disturbance.
    suspend_if: Passive architecture is path viable in fewer than 16 of 20 seeds,
      making the preregistered passive comparator too fragile for the intended graded-disturbance
      interpretation.
provenance:
