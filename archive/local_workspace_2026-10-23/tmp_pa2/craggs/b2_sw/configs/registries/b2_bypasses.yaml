items:
- id: B2_BRUTE_FORCE_BYPASS_01
  target_necessity_claim: Reciprocal closure-like topology is necessary for the decisive
    artificial maintenance outcomes tested in B2.
  mechanism_deliberately_absent: Strongly connected reciprocal maintenance graph.
  alternative_mechanism_supplied: Direct deficit-based internal maintenance allocation
    using the same total per-step maintenance budget of 0.03.
  capacity_matching_procedure: Same components, viability thresholds, disturbance
    sequences, target state, horizon and maintenance budget as the reciprocal architecture.
  noninferiority_criterion: Absolute path-viability difference no greater than 0.10
    and mean terminal minimum-state difference no greater than 0.10 under high disturbance;
    after C1 ablation, mean non-ablated component state no more than 0.05 below the
    reciprocal architecture.
  affected_hypotheses:
  - H1.6
